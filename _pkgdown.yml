url: https://sdvmodels.sportsdataverse.org/

# llms.txt generation needs pandoc >= 3; keep builds reproducible across
# environments that ship older pandoc.
llm-docs: false

# pkgdown renders every top-level and .github/*.md file as a page; keep the
# contributor/agent notes out of the search index so results stay on-topic.
search:
  exclude:
  - CLAUDE.html
  - PULL_REQUEST_TEMPLATE.html

template:
  bootstrap: 5
  light-switch: true
  bootswatch: cosmo
  includes:
    in_header: |
      <!-- Privacy-friendly analytics by Plausible -->
      <script async src="https://plausible.io/js/pa-cAqkloHf-OvuOIlv1-A41.js"></script>
      <script>
        window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
        plausible.init()
      </script>
  # Palette sampled from the hex logo (the Ensemble Battery): navy body
  # #15254C / #0B1636 and lid #1B2C57, gold band #E0A526 with the bright
  # gold contribution #FFC857, slate-blue trees #6A7DAB, cream lettering
  # #F4F1EA, platinum terminal #D9DCE1. Bootstrap 5.3 color modes derive dark
  # mode from these; the light/dark split is finished with
  # `[data-bs-theme]`-scoped custom properties in pkgdown/extra.css.
  bslib:
    bg: "#FFFFFF"
    fg: "#15254C"
    primary: "#0E1A3A"
    secondary: "#6A7DAB"
    success: "#E0A526"
    link-color: "#8A6200"
    link-hover-color: "#8A6200"
    code-color: "#15254C"
    border-color: "#6A7DAB"
    navbar-light-bg: "#0E1A3A"
    navbar-light-color: "#F4F1EA"
    navbar-light-hover-color: "#FFC857"
    navbar-light-active-color: "#FFC857"
    navbar-light-brand-color: "#FFFFFF"
    navbar-light-brand-hover-color: "#FFC857"
    navbar-dark-bg: "#0E1A3A"
    navbar-dark-color: "#F4F1EA"
    navbar-dark-hover-color: "#FFC857"
    navbar-dark-active-color: "#FFC857"
    nav-link-hover-color: "#FFC857"
    nav-link-focus-color: "#FFC857"
    nav-link-dropdown-toggle-hover-color: "#FFC857"
    navbar-hover-color: "#FFC857"
    navbar-brand-hover-color: "#FFC857"
    nav-tabs-link-active-bg: "#E0A526"
    nav-pills-link-active-color: "#8A6200"
    btn-link-color: "#8A6200"
    btn-link-hover-color: "#E0A526"
    dropdown-link-color: "#8A6200"
    input-btn-focus-color: "#E0A526"
    dropdown-dark-link-hover-bg: "#E0A526"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  opengraph:
    image:
      src: "https://raw.githubusercontent.com/sportsdataverse/sdvmodels/main/.github/social-card.png"
      alt: "sdvmodels social preview card: the Ensemble Battery hex logo and the tagline Fitted models. Installed once."
    twitter:
      creator: "@saiemgilani"
      site: "@SportsDataverse"
      card: summary_large_image

authors:
  Saiem Gilani:
    href: https://x.com/saiemgilani

home:
  title: Fitted Models for the SportsDataverse
  description: >
    The fitted models behind cfbfastR and the wider SportsDataverse, packaged
    once: expected points, win probability, field goal, fourth down, two point
    conversion, expected pass, completion probability and quarterback rating,
    as raw xgboost vectors with their model cards and feature contracts.

