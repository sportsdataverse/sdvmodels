reference:
- title: Expected points and win probability
  desc: Score a game state. Load each raw vector with `xgboost::xgb.load.raw()`.
  contents:
  - cfb_ep_model
  - cfb_wp_spread_model
  - cfb_wp_naive_model
  - cfb_wp_ot_reach_model
- title: Kicking and fourth down
  desc: Field goals, fourth-down conversions, two point tries and punts.
  contents:
  - cfb_fg_model
  - cfb_fd_model
  - cfb_two_pt_model
  - cfb_punt_distribution
  - cfb_field_position_ep
- title: Passing and quarterback play
  contents:
  - cfb_xpass_model
  - cfb_cp_model
  - cfb_cp_air_yards_model
  - cfb_qbr_model
- title: Model cards and the bundle manifest
  desc: What each model is, how it was trained, and the feature contract it expects.
  contents:
  - cfb_model_cards
  - cfb_model_manifest
- title: Package
  contents:
  - sdvmodels-package

